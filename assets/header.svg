<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img" aria-label="coffee&lt;js&gt;snake — Brewing Java, serving JS, taming Python">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="crema" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c9a5"/>
      <stop offset="1" stop-color="#c9a276"/>
    </linearGradient>
    <clipPath id="cup"><rect x="70" y="92" width="88" height="70" rx="8"/></clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace; }
      .steam { fill: none; stroke: #e8c9a5; stroke-width: 3; stroke-linecap: round; opacity: 0; }
      .s1 { animation: rise 3.2s ease-in-out infinite; }
      .s2 { animation: rise 3.2s ease-in-out infinite 1.1s; }
      .s3 { animation: rise 3.2s ease-in-out infinite 2.2s; }
      @keyframes rise {
        0%   { opacity: 0;   transform: translateY(10px); }
        30%  { opacity: .75; }
        100% { opacity: 0;   transform: translateY(-26px); }
      }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Menu board -->
  <rect x="0.5" y="0.5" width="919" height="239" rx="14" fill="url(#board)" stroke="#30363d"/>
  <!-- Chalk rail -->
  <rect x="24" y="214" width="872" height="2" fill="#30363d"/>

  <!-- Cup -->
  <g transform="translate(0,0)">
    <rect x="70" y="92" width="88" height="70" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="2.5"/>
    <rect x="70" y="92" width="88" height="14" fill="url(#crema)" clip-path="url(#cup)"/>
    <path d="M158 108 h14 a16 16 0 0 1 0 32 h-14" fill="none" stroke="#8b949e" stroke-width="2.5"/>
    <rect x="58" y="166" width="112" height="4" rx="2" fill="#30363d"/>
    <!-- Steam -->
    <path class="steam s1" d="M92 84 c-6 -8 6 -14 0 -22"/>
    <path class="steam s2" d="M114 84 c-6 -8 6 -14 0 -22"/>
    <path class="steam s3" d="M136 84 c-6 -8 6 -14 0 -22"/>
  </g>

  <!-- Name -->
  <text x="222" y="104" class="mono" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="-1">
    coffee<tspan fill="#f0c33c">&lt;js&gt;</tspan>snake<tspan class="cursor" fill="#e8c9a5">_</tspan>
  </text>
  <!-- Order line -->
  <text x="224" y="142" class="mono" font-size="17" fill="#c9d1d9">Brewing Java, serving JS, taming Python.</text>
  <text x="224" y="168" class="mono" font-size="15" fill="#8b949e">Clean architecture. Honest metrics. DX without pain.</text>

  <!-- Ticket stub -->
  <g transform="translate(724,32)">
    <rect x="0" y="0" width="150" height="170" rx="10" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/>
    <text x="16" y="28" class="mono" font-size="12" fill="#8b949e">order № 0001</text>
    <text x="16" y="54" class="mono" font-size="13" fill="#e8c9a5">java   ...  brewed</text>
    <text x="16" y="74" class="mono" font-size="13" fill="#f0c33c">js     ...  served</text>
    <text x="16" y="94" class="mono" font-size="13" fill="#7fb4e0">python ...  tamed</text>
    <text x="16" y="114" class="mono" font-size="13" fill="#a48be0">php    ...  warm</text>
    <text x="16" y="134" class="mono" font-size="13" fill="#e57b5a">rust   ...  cold</text>
    <text x="16" y="154" class="mono" font-size="13" fill="#8fd1a8">c++    ...  short</text>
  </g>
</svg>
