<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="IwillLiveDev — where most of the menu gets brewed">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace; }
    </style>
    <linearGradient id="crema" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c9a5"/>
      <stop offset="1" stop-color="#c9a276"/>
    </linearGradient>
  </defs>

  <!-- Tray -->
  <rect x="0.5" y="0.5" width="419" height="149" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="419" height="4" rx="2" fill="url(#crema)"/>

  <!-- Small cup mark -->
  <g transform="translate(24,40)">
    <rect x="0" y="6" width="30" height="24" rx="4" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
    <rect x="0" y="6" width="30" height="6" fill="url(#crema)"/>
    <path d="M30 12 h5 a6 6 0 0 1 0 12 h-5" fill="none" stroke="#8b949e" stroke-width="2"/>
    <rect x="-4" y="32" width="38" height="2" rx="1" fill="#30363d"/>
  </g>

  <text x="72" y="52" class="mono" font-size="20" font-weight="700" fill="#e6edf3">IwillLiveDev</text>
  <text x="72" y="74" class="mono" font-size="12" fill="#8b949e">today's special</text>
  <text x="72" y="96" class="mono" font-size="12" fill="#c9d1d9">Where most of the menu gets brewed.</text>

  <!-- Chips -->
  <g class="mono" font-size="11">
    <rect x="72" y="112" width="44" height="20" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="94" y="126" fill="#e8c9a5" text-anchor="middle">java</text>
    <rect x="122" y="112" width="34" height="20" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="139" y="126" fill="#f0c33c" text-anchor="middle">js</text>
    <rect x="162" y="112" width="58" height="20" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="191" y="126" fill="#7fb4e0" text-anchor="middle">python</text>
  </g>

  <text x="396" y="126" class="mono" font-size="12" fill="#8b949e" text-anchor="end">open →</text>
</svg>
