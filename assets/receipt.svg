<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-label="Receipt: seven languages served since 2023">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace; }
    </style>
    <pattern id="tear" width="14" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8 L7 0 L14 8 Z" fill="#161b22"/>
    </pattern>
  </defs>

  <!-- Paper -->
  <rect x="20" y="8" width="380" height="276" fill="#161b22" stroke="#30363d"/>
  <rect x="20" y="284" width="380" height="8" fill="url(#tear)"/>

  <text x="40" y="42" class="mono" font-size="15" font-weight="700" fill="#e6edf3">coffee&lt;js&gt;snake</text>
  <text x="380" y="42" class="mono" font-size="12" fill="#8b949e" text-anchor="end">since 2023</text>
  <text x="40" y="60" class="mono" font-size="11" fill="#8b949e">github.com/IwillLive</text>

  <line x1="40" y1="76" x2="380" y2="76" stroke="#30363d" stroke-dasharray="3 3"/>

  <g class="mono" font-size="13">
    <text x="40"  y="102" fill="#e8c9a5">java</text>       <text x="380" y="102" fill="#c9d1d9" text-anchor="end">brewed daily</text>
    <text x="40"  y="126" fill="#f0c33c">javascript</text> <text x="380" y="126" fill="#c9d1d9" text-anchor="end">served fresh</text>
    <text x="40"  y="150" fill="#7fb4e0">python</text>     <text x="380" y="150" fill="#c9d1d9" text-anchor="end">tamed</text>
    <text x="40"  y="174" fill="#a48be0">php</text>        <text x="380" y="174" fill="#c9d1d9" text-anchor="end">kept warm</text>
    <text x="40"  y="198" fill="#e57b5a">rust</text>       <text x="380" y="198" fill="#c9d1d9" text-anchor="end">cold brew</text>
    <text x="40"  y="222" fill="#8fd1a8">c++</text>        <text x="380" y="222" fill="#c9d1d9" text-anchor="end">ristretto</text>
  </g>

  <line x1="40" y1="240" x2="380" y2="240" stroke="#30363d" stroke-dasharray="3 3"/>

  <text x="40" y="264" class="mono" font-size="12" fill="#8b949e">total</text>
  <text x="380" y="264" class="mono" font-size="12" fill="#e8c9a5" text-anchor="end">clean architecture, no regrets</text>
</svg>
